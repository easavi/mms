spring:
  application:
    name: mms-listener
  main:
    web-application-type: none  # Disable web server
    banner-mode: console       # Show banner in console only

# MMS Backend Configuration
mms:
  backend:
    url: http://localhost:8080
    username: admin
    password: admin123
  
  # Folders to monitor for LISTENER mode (uploads to backend and deletes files)
  folders:
    - "D:/dev/mms/temp/files"
  
  # Folder copy mappings for COPY mode (copies files and preserves originals)
  # In ALL mode, both configurations above are used simultaneously
  folder-copy-mappings:
    - source: "D:/dev/mms/temp/original"
      destination: "D:/dev/mms/temp/files"
  
  # File patterns to include/exclude (applies to both modes)
  file-patterns:
    include: "\\.(jpg|jpeg|png|gif|bmp|tiff|webp|mp4|avi|mov|wmv|mkv|mp3|wav|flac|pdf|doc|docx|txt|rtf|odt)$"
    exclude: "\\.(tmp|temp|partial|download|crdownload|part|~|log|lock|swp|DS_Store)$"

logging:
  level:
    com.mms.listener: DEBUG
    org.springframework.web.reactive: DEBUG
