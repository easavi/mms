spring:
  application:
    name: mms-listener
  main:
    web-application-type: none  # Disable web server
    banner-mode: console       # Show banner in console only

# MMS Backend Configuration
mms:
  backend:
    url: http://localhost:8080
    username: admin
    password: admin123
  
  # Folders to monitor (only used in listener mode)
  folders:
    - "D:/dev/mms/temp/files"
  
  # Folder copy mappings (from -> to)
  folder-copy-mappings:
    - source: "D:/dev/mms/temp/source1"
      destination: "D:/dev/mms/temp/destination1"
    - source: "D:/dev/mms/temp/source2"
      destination: "D:/dev/mms/temp/destination2"
  
  # File patterns to include/exclude
  file-patterns:
    include: "\\.(jpg|jpeg|png|gif|bmp|mp4|avi|mov|wmv|pdf|doc|docx|txt)$"
    exclude: "\\.(tmp|temp|log)$"

logging:
  level:
    com.mms.listener: DEBUG
    org.springframework.web.reactive: DEBUG
