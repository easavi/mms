spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mms
    username: admin
    password: adminmms
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
      location: ${java.io.tmpdir}
security:
  jwt:
    secret: Vc0AdKyBIffZ5ErS4yvib99zRZkdR5eMuxzHVDLUBNk=
    expiration: 86400000 # 24 hours in milliseconds

storage:
  type: local
  local:
    base-path: D:/dev/mms/temp/buckets  # Local storage directory

server:
  port: 8080

logging:
  level:
    com.mms: DEBUG